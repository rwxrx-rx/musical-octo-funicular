name: Android CI Build

# This workflow will run every time there is a push or pull request to the main branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code from repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java Development Kit
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Grant execute permission to Gradle Wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Build APK using Gradle (generates Debug version)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. Upload the build result (APK) as an artifact so it can be downloaded
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
